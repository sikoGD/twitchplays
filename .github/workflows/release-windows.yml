name: Windows release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build controller helper
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name TwitchPlaysController --hidden-import pyautogui controller_app.py

      - name: Build desktop app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name TwitchPlays ui.py

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Copy-Item dist/TwitchPlays.exe, dist/TwitchPlaysController.exe, README.md -Destination dist/release
          Compress-Archive -Path dist/release/* -DestinationPath dist/TwitchPlays-windows-x64.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Twitch Plays v1.0.${{ github.run_number }}
          body: |
            Windows desktop release. Download and extract `TwitchPlays-windows-x64.zip`, then keep both `.exe` files in the same folder and launch `TwitchPlays.exe`.
          files: dist/TwitchPlays-windows-x64.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
